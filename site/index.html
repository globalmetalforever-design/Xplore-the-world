<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102c45"><title>Explore the World</title>
<style>
:root{--navy:#102c45;--blue:#246b91;--bg:#f2f6f8;--ink:#172b3a;--muted:#607482;--line:#dce6eb;--white:#fff;--gold:#e7b85b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.hero{background:linear-gradient(135deg,#102c45,#246b91);color:#fff;padding:28px 18px 24px}.wrap{max-width:1050px;margin:auto}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:.75rem;font-weight:700;color:#c8e4f2}.hero h1{margin:5px 0;font-size:clamp(1.8rem,5vw,2.7rem)}.hero p{margin:0;color:#e1eff5}.main{max-width:1050px;margin:auto;padding:18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}.search{flex:1;min-width:220px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}.tab,button{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:650;cursor:pointer}.tab{background:#e3edf2;color:var(--navy)}.tab.active{background:var(--navy);color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:13px}.country{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;text-align:left;box-shadow:0 2px 7px #102c450a;cursor:pointer;transition:.15s}.country:hover{transform:translateY(-2px);box-shadow:0 6px 18px #102c4514}.flag{font-size:2rem}.country h3{margin:4px 0 2px;font-size:1.1rem}.sub{color:var(--muted);font-size:.9rem}.profile{display:none;background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}.profile.show{display:block}.back{background:#e7eff3;color:var(--navy);margin-bottom:12px}.profiletop{display:flex;align-items:center;gap:14px}.bigflag{font-size:3.4rem}.profile h2{margin:0;font-size:1.5rem}.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:18px 0}.fact{background:#f2f6f8;border-radius:10px;padding:11px}.fact small{display:block;color:var(--muted);font-weight:650}.fact b{display:block;margin-top:2px}.desc{color:#3c5362}.quiz{margin-top:20px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.quiz h2{margin:0 0 8px}.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:14px 0}.answers button{background:#e8f0f4;color:var(--navy);text-align:left}.answers button:disabled{opacity:.8;cursor:default}.answers button.correct{background:#d8f1df;color:#176334}.answers button.wrong{background:#fbe1df;color:#9b2b27}.quizline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.primary{background:var(--blue);color:#fff}.secondary{background:#e8f0f4;color:var(--navy)}#feedback{font-weight:650}.foot{color:var(--muted);font-size:.85rem;text-align:center;padding:20px}
</style></head><body><header class="hero"><div class="wrap"><div class="eyebrow">A little geography, a lot of discovery</div><h1>Explore the World 🌍</h1><p>Browse countries, discover quick facts, and test your geography knowledge.</p></div></header><main class="main"><section id="profile" class="profile" aria-live="polite"></section><div class="toolbar"><input id="search" class="search" type="search" placeholder="Search countries or capitals…" aria-label="Search countries or capitals"></div><div class="tabs" id="regions"><button class="tab active" data-region="All">All countries</button><button class="tab" data-region="Asia">Asia</button><button class="tab" data-region="Europe">Europe</button><button class="tab" data-region="Africa">Africa</button><button class="tab" data-region="Americas">Americas</button><button class="tab" data-region="Oceania">Oceania</button></div><div id="grid" class="grid"></div><section class="quiz"><h2>Quick geography quiz</h2><p id="question">Which country has Tokyo as its capital?</p><div id="answers" class="answers"><button>Japan</button><button>China</button><button>South Korea</button><button>Thailand</button></div><div class="quizline"><button id="next" class="primary">Next question</button><span id="feedback" aria-live="polite"></span><span id="score" class="sub">Score: 0</span></div></section><p class="foot">Explore the World · Starter edition · Country facts are a compact learning overview.</p></main>
<script>
const countries=[
['🇮🇳','India','Asia','New Delhi','Indian rupee (INR)','Hindi and English (Union official); many regional languages','About 1.43 billion','India is a South Asian country with diverse landscapes, languages, and cultural traditions.'],
['🇯🇵','Japan','Asia','Tokyo','Japanese yen (JPY)','Japanese','About 124 million','An East Asian island country known for its cities, mountains, and long cultural history.'],
['🇨🇳','China','Asia','Beijing','Renminbi (CNY)','Standard Chinese (Mandarin)','About 1.41 billion','A large East Asian country with varied geography and one of the world’s oldest continuous civilizations.'],
['🇰🇷','South Korea','Asia','Seoul','South Korean won (KRW)','Korean','About 52 million','A country on the southern part of the Korean Peninsula, with a highly urbanized society.'],
['🇮🇩','Indonesia','Asia','Jakarta','Indonesian rupiah (IDR)','Indonesian','About 280 million','An archipelago in Southeast Asia spanning thousands of islands.'],
['🇹🇭','Thailand','Asia','Bangkok','Thai baht (THB)','Thai','About 72 million','A Southeast Asian country with tropical coastlines, forests, and a rich cultural heritage.'],
['🇸🇬','Singapore','Asia','Singapore','Singapore dollar (SGD)','English, Malay, Mandarin, Tamil','About 6 million','A city-state and island country at the southern end of the Malay Peninsula.'],
['🇸🇦','Saudi Arabia','Asia','Riyadh','Saudi riyal (SAR)','Arabic','About 34 million','A country occupying much of the Arabian Peninsula, with extensive desert regions.'],
['🇬🇧','United Kingdom','Europe','London','Pound sterling (GBP)','English','About 69 million','A country made up of England, Scotland, Wales, and Northern Ireland.'],
['🇫🇷','France','Europe','Paris','Euro (EUR)','French','About 68 million','A country in western Europe with mainland territory and overseas regions.'],
['🇩🇪','Germany','Europe','Berlin','Euro (EUR)','German','About 84 million','A central European country with a federal system and varied regional landscapes.'],
['🇮🇹','Italy','Europe','Rome','Euro (EUR)','Italian','About 59 million','A Mediterranean country extending into the sea in the shape of a boot.'],
['🇪🇸','Spain','Europe','Madrid','Euro (EUR)','Spanish','About 48 million','A country on the Iberian Peninsula, with several co-official regional languages.'],
['🇳🇴','Norway','Europe','Oslo','Norwegian krone (NOK)','Norwegian and Sami languages','About 5.6 million','A northern European country known for its mountainous coastline and fjords.'],
['🇳🇬','Nigeria','Africa','Abuja','Naira (NGN)','English (official); many local languages','About 230 million','A West African country with a large population and extensive cultural and linguistic diversity.'],
['🇪🇬','Egypt','Africa','Cairo','Egyptian pound (EGP)','Arabic','About 113 million','A northeast African country connecting Africa and Asia through the Sinai Peninsula.'],
['🇰🇪','Kenya','Africa','Nairobi','Kenyan shilling (KES)','Swahili and English','About 56 million','An East African country with Indian Ocean coastline, highlands, and savanna.'],
['🇿🇦','South Africa','Africa','Pretoria (executive)','South African rand (ZAR)','12 official languages','About 63 million','A country at Africa’s southern tip with diverse regions and multiple capital functions.'],
['🇺🇸','United States','Americas','Washington, D.C.','US dollar (USD)','No federal official language','About 340 million','A country in North America composed of 50 states and a federal district.'],
['🇨🇦','Canada','Americas','Ottawa','Canadian dollar (CAD)','English and French (federal official)','About 41 million','A large North American country stretching from the Atlantic to the Pacific and Arctic oceans.'],
['🇧🇷','Brazil','Americas','Brasília','Brazilian real (BRL)','Portuguese','About 203 million','The largest country in South America, containing much of the Amazon Basin.'],
['🇲🇽','Mexico','Americas','Mexico City','Mexican peso (MXN)','Spanish and many Indigenous languages','About 129 million','A North American country with Pacific and Gulf coastlines and varied climates.'],
['🇦🇺','Australia','Oceania','Canberra','Australian dollar (AUD)','English is widely used','About 27 million','A country and continent in the Southern Hemisphere, with arid interior and extensive coastlines.'],
['🇳🇿','New Zealand','Oceania','Wellington','New Zealand dollar (NZD)','English, Māori, New Zealand Sign Language','About 5.3 million','An island country in the southwestern Pacific Ocean, made up mainly of two large islands.']
].map(([flag,name,region,capital,currency,languages,population,description])=>({flag,name,region,capital,currency,languages,population,description}));
let region='All',score=0,qIndex=0,answered=false;
const $=id=>document.getElementById(id);
function render(){const query=$('search').value.trim().toLowerCase();const list=countries.filter(c=>(region==='All'||c.region===region)&&(`${c.name} ${c.capital}`.toLowerCase().includes(query)));$('grid').innerHTML=list.map(c=>`<button class="country" data-name="${c.name}"><div class="flag">${c.flag}</div><h3>${c.name}</h3><div class="sub">${c.region} · Capital: ${c.capital}</div></button>`).join('')||'<p>No matching countries. Try another search.</p>';document.querySelectorAll('.country').forEach(b=>b.addEventListener('click',()=>showProfile(b.dataset.name)));}
function showProfile(name){const c=countries.find(x=>x.name===name);$('profile').classList.add('show');$('profile').innerHTML=`<button class="back" id="back">← Back to countries</button><div class="profiletop"><div class="bigflag">${c.flag}</div><div><h2>${c.name}</h2><div class="sub">${c.region}</div></div></div><div class="facts"><div class="fact"><small>Capital</small><b>${c.capital}</b></div><div class="fact"><small>Currency</small><b>${c.currency}</b></div><div class="fact"><small>Population</small><b>${c.population}</b></div><div class="fact"><small>Languages</small><b>${c.languages}</b></div></div><p class="desc">${c.description}</p>`;$('back').onclick=()=>$('profile').classList.remove('show');$('profile').scrollIntoView({behavior:'smooth',block:'start'});}
$('search').addEventListener('input',render);$('regions').addEventListener('click',e=>{const b=e.target.closest('button[data-region]');if(!b)return;region=b.dataset.region;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===b));render();});
const quiz=[['Which country has Tokyo as its capital?',['Japan','China','South Korea','Thailand'],'Japan'],['What is the capital of Canada?',['Toronto','Ottawa','Vancouver','Montreal'],'Ottawa'],['Which country is in South America?',['Kenya','Brazil','Japan','Norway'],'Brazil'],['What is the capital of Egypt?',['Cairo','Abuja','Nairobi','Riyadh'],'Cairo'],['Which country uses the yen?',['India','Australia','Japan','Mexico'],'Japan'],['Canberra is the capital of which country?',['New Zealand','Australia','Canada','United Kingdom'],'Australia']];
function drawQuiz(){answered=false;const q=quiz[qIndex%quiz.length];$('question').textContent=q[0];$('answers').innerHTML=q[1].map(a=>`<button>${a}</button>`).join('');$('feedback').textContent='';$('answers').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;const correct=b.textContent===q[2];if(correct){score++;b.classList.add('correct');$('feedback').textContent='Correct!';}else{b.classList.add('wrong');$('feedback').textContent='Answer: '+q[2];[...$('answers').children].find(x=>x.textContent===q[2]).classList.add('correct');} $('answers').querySelectorAll('button').forEach(x=>x.disabled=true);$('score').textContent='Score: '+score;});}
$('next').onclick=()=>{qIndex++;drawQuiz();};render();drawQuiz();
</script></body></html>
